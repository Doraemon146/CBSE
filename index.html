<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Little Space</title>
  <meta name="description" content="Just two people. One little corner of the internet." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>

  <main class="page" id="landing-page">

      <button class="glow-btn" id="enter-btn" type="button">Enter</button>
    </section>
  </main>

  <script src="app.js"></script>

</html>
