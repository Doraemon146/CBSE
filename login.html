<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0714">
  <title>Unlock — Our Little Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main class="page" id="choose-page">
    <section class="choose-content">
      <p class="landing-eyebrow">private space</p>
      <h2 class="section-title">Who are you?</h2>
      <p class="section-sub">Choose your side. You will be asked your question every time you return.</p>
      <div class="choose-grid">
        <button class="person-card her" data-person="her"><span class="person-icon">♡</span><span class="person-label">HER</span></button>
        <button class="person-card him" data-person="him"><span class="person-icon">♥</span><span class="person-label">HIM</span></button>
      </div>
    </section>
  </main>

  <main class="page" id="unlock-page" style="display:none">
    <section class="glass-card unlock-card">
      <p class="unlock-eyebrow" id="unlock-eyebrow"></p>
      <h3 id="question-text" class="question-text"></h3>
      <input type="password" id="answer-input" class="input-field" placeholder="Your answer..." autocomplete="off" autocapitalize="off">
      <p class="error-msg" id="error-msg" role="alert"></p>
      <button class="glow-btn btn-full" id="unlock-btn">Unlock</button>
      <div class="text-center"><a href="#" class="back-link" id="back-link">← choose different person</a></div>
    </section>
  </main>

  <main class="page" id="success-page" style="display:none">
    <section class="success-content">
      <div class="success-heart">♡</div>
      <h2 class="success-title">Welcome back.</h2>
      <p class="success-sub">Opening your little space...</p>
    </section>
  </main>
  <script type="module" src="login.js"></script>
<script>
window.addEventListener("error", function(e) {
  console.error(e.error || e.message);
});
window.addEventListener("unhandledrejection", function(e) {
  console.error(e.reason);
});
</script>
</body>
</html>
