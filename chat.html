<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>Our Little Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Loading gate -->
  <main class="page" id="loading-page">
    <div class="loading-content">
      <div class="spinner big"></div>
      <p>Loading your space...</p>
    </div>
  </main>

  <!-- Chat -->
  <main class="chat-page" id="chat-page" style="display: none;">
    <header class="chat-header">
      <div class="avatar" id="partner-avatar"></div>
      <div class="header-info">
        <div class="header-name" id="partner-name"></div>
        <div class="header-status" id="partner-status">offline</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clear-btn" type="button" title="Clear chat" aria-label="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <button class="icon-btn" id="logout-btn" type="button" title="Leave" aria-label="Leave">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <section class="messages-container" id="messages" aria-live="polite"></section>

    <footer class="input-area">
      <div class="input-wrapper">
        <input type="text" id="message-input" class="message-input" placeholder="Type something sweet..." autocomplete="off" maxlength="5000" />
        <button class="send-btn" id="send-btn" type="button" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </footer>
  </main>

  <script type="module" src="chat.js"></script>
</body>
</html>
